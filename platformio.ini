; PlatformIO Project Configuration File
[platformio]
description = LVGL-320-480
default_envs = LVGL-320-480
boards_dir = boards
data_dir = littlefs
lib_dir = libraries
src_dir = src

[libraries]

[com]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32s3dev
framework = arduino
board_build.filesystem = littlefs
build_flags = 
	-D LOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
lib_deps = 

[env:LVGL-320-480]
platform = ${com.platform}
board = 320x480
framework = ${com.framework}
board_build.filesystem = ${com.board_build.filesystem}
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps = 
	arduino-libraries/Arduino_CRC32@^1.0.0
	https://github.com/bitcoin-ring/Adafruit-PN532-NTAG424.git
	moononournation/GFX Library for Arduino@^1.5.0
	arkhipenko/TaskScheduler@^3.7.0
	lvgl/lvgl@^9.2.2
	links2004/WebSockets@^2.4.1
	bblanchon/ArduinoJson@^6.20.0
	madhephaestus/ESP32Servo
	earlephilhower/BackgroundAudio@^1.3.3
build_flags = 
	${com.build_flags}
	-D LV_CONF_PATH=${platformio.workspace_dir}/../include/lv_conf.h
	-D LV_CONF_SUPPRESS_DEFINE_CHECK
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D BRANDING_BITCOIN_FRIESLAND
